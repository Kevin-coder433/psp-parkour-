name: Build PSP EBOOT
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
    image: ghcr.io/pspdev/pspsdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile EBOOT.PBP
        run: make
      - name: Upload PSP Game
        uses: actions/upload-artifact@v4
        with:
          name: Parkour_PSP
          path: EBOOT.PBP
